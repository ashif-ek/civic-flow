name: CivicFlow Safe CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Security & Secrets Leak Check
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Unintended Secrets or .env Files
        run: |
          echo "Scanning for accidental committed secret files..."
          if find . -name "*.env" -not -name "*.env.example" | grep -q .; then
            echo "ERROR: Found committed .env file!"
            exit 1
          fi
          echo "Secret file scan passed safely."

  # 2. Backend Automated Checks & Tests
  backend-test:
    name: Django Backend Test & Lint
    runs-on: ubuntu-latest
    needs: security-audit
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System & Migration Check
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-test-secret-key-12345
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          DATABASE_URL: "" # Fallback to local SQLite during isolated CI runner

      - name: Run Django Unit Tests
        run: |
          python manage.py test api --noinput
        env:
          SECRET_KEY: ci-test-secret-key-12345
          DEBUG: "True"
          ALLOWED_HOSTS: "*"
          DATABASE_URL: "" # Uses SQLite in-memory test runner for CI isolation

      - name: Verify Collectstatic
        run: |
          python manage.py collectstatic --noinput
        env:
          SECRET_KEY: ci-test-secret-key-12345
          DEBUG: "False"

  # 3. Frontend Typecheck & Production Build
  frontend-build:
    name: Vite & React Build Verification
    runs-on: ubuntu-latest
    needs: security-audit
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Production Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://civicflow-backend-production.up.railway.app/api
